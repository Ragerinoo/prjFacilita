<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" role="img" aria-label="Ilustração da frente da máquina com luzes, teclas, alavanca, reservatório e bico">
  <rect width="400" height="500" fill="#f4efe9"/>
  <rect x="20" y="20" width="360" height="460" rx="24" fill="#ffffff" stroke="#5b3a29" stroke-width="4"/>
  <!-- áreas em % da imagem: luz_alerta (10,8,16,12), luz_amarela (30,8,16,12) -->
  <circle cx="72" cy="70" r="18" fill="#b3261e"/>
  <circle cx="152" cy="70" r="18" fill="#f5b400"/>
  <!-- reservatório (60,8,30,30) -->
  <rect x="244" y="44" width="108" height="140" rx="12" fill="#cfe8f6" stroke="#2c6e91" stroke-width="3"/>
  <!-- teclas (10,24,40,14) -->
  <rect x="48" y="130" width="60" height="44" rx="10" fill="#e0d3c8" stroke="#5b3a29" stroke-width="3"/>
  <rect x="124" y="130" width="60" height="44" rx="10" fill="#e0d3c8" stroke="#5b3a29" stroke-width="3"/>
  <!-- alavanca (10,42,80,14) -->
  <rect x="48" y="224" width="304" height="56" rx="14" fill="#8c6a54" stroke="#5b3a29" stroke-width="3"/>
  <!-- bico (35,60,30,14) -->
  <rect x="160" y="304" width="120" height="56" rx="12" fill="#444444"/>
  <text x="200" y="440" font-family="sans-serif" font-size="16" text-anchor="middle" fill="#3b2a20">Ilustração de exemplo</text>
</svg>
